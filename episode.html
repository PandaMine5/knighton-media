                --player-margin-inline: 18px;
                --player-margin-block: 10px;
            }

            .player {
                display: none;
                position: relative;
                width: 100%;
            }

            /* Remove HTML subtitles */
            video::cue {
                opacity: 0 !important;
                visibility: hidden !important;
            }

            video::-webkit-media-text-track-display {
                display: none !important;
            }

            video::-webkit-media-text-track-container {
                display: none !important;
            }

            #video {
                position: relative;
                display: block;
                width: 100%;
                aspect-ratio: 16 / 9.5;
                object-fit: cover;
                background: black;

                &.default {
                    filter: saturate(1);
                }

                &.desaturated {
                    filter: contrast(0.86) saturate(0.96) brightness(1.04);
                }

                &.vibrant {
                    filter: saturate(1.087) contrast(1.07) hue-rotate(-7.7deg) sepia(0.063) opacity(0.978);
                }

                &.filmic {
                    filter: brightness(0.974) saturate(1.197) contrast(1.294) hue-rotate(-12deg) sepia(0.343) opacity(0.94);
                }

                &.hdr {
                    filter: brightness(0.82) saturate(1.237) contrast(1.483) hue-rotate(-10deg) sepia(0.17);
                }
            }

            .player:fullscreen #video,
            .player:-webkit-full-screen #video {
                width: 100vw !important;
                height: 100vh !important;
                object-fit: contain !important;
            }

            .player__overlay {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background: hsl(0 0% 0% / 0.2);
            }

            .player__overlay,
            .player__back-btn {
                opacity: 1;
                transition:
                    opacity 200ms ease-in-out,
                    backdrop-filter 200ms ease-in-out;

                &.hidden {
                    opacity: 0;
                    pointer-events: none;
                }
            }

            .player__back-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                top: 8px;
                left: 14px;
                filter: drop-shadow(0 0 3px hsl(0 0% 0% / 0.75));
                padding: 6px;
                z-index: 5;
                pointer-events: auto !important;
            }

            .player__controls--top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: var(--player-margin-block);
                margin-inline: var(--player-margin-inline);
                z-index: 2;
            }

            .player__meta {
                text-align: center;
                flex: 1;
            }

            .player__meta-title,
            .player__meta-episode {
                font-weight: 500;
                text-shadow: 0 0 3px hsl(0 0% 0% / 0.65);
            }

            .player__meta-title {
                font-size: clamp(0.75rem, 3vw, 0.875rem);
                margin-bottom: 0.125rem;
            }

            .player__meta-episode {
                font-size: clamp(0.625rem, 3vw, 0.75rem);
                opacity: 0.75;
            }

            .player__controls--center {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .player__button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: clamp(44px, 5vw, 90px);
                aspect-ratio: 1;
                z-index: 2;
            }

            .player__icon--play {
                width: clamp(20px, 2.75vw, 34px);
                aspect-ratio: 1;
                filter: drop-shadow(0 0 2px hsl(0 0% 0% / 0.35));
            }

            .player__button--skip {
                position: absolute;
                width: 34%;
                height: 100%;

                &.left {
                    left: 0%;
                }
                &.right {
                    right: 0%;
                }
            }

            .player__controls--bottom {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-inline: var(--player-margin-inline);
                margin-bottom: var(--player-margin-block);
                z-index: 3;
            }

            .player__time-wrapper {
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }

            .player__time {
                font-size: clamp(10px, 2vw, 11px);
                font-weight: 600;
                color: white;
                text-shadow: 0px 1px 1px hsl(0 0% 0% / 0.5);

                &.end {
                    opacity: 0.75;
                }
            }

            .player__seekbar {
                position: relative;
                display: flex;
                align-items: center;
                width: 100%;
                height: 100%;
                cursor: pointer;
            }

            .player__seekbar-track,
            .player__seekbar-fill,
            .player__seekbar-buffered {
                position: absolute;
                left: 0;
                top: 50%;
                height: 3px;
                width: 100%;
                border-radius: 100vmax;
                transform: translateY(-50%);
            }

            .player__seekbar-track {
                background: hsl(0 0% 85% / 0.45);
            }

            .player__seekbar-fill {
                background: white;
                width: 0%;
            }

            .player__seekbar-buffered {
                background: hsl(0 0% 100% / 0.3);
                width: 0%;
            }

            .player__seekbar input[type="range"] {
                all: unset;
                position: absolute;
                inset: 0;
                background: transparent;
                margin: 0;
                z-index: 2;
            }

            .player__seekbar input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                border: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: white;
                filter: drop-shadow(-1px 0px 1px hsl(0 0% 0% / 0.15));
            }

            .player__seekbar input[type="range"]::-moz-range-thumb {
                appearance: none;
                border: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: white;
                filter: drop-shadow(-1px 0px 1px hsl(0 0% 0% / 0.15));
            }

            .player__toolbar {
                display: flex;
                justify-content: space-between;
            }

            .player__toolbar-group {
                display: flex;
                align-items: center;
                gap: clamp(0.875rem, 5vw, 1.125rem);
                border-radius: 100vmax;
                background: hsl(0 0% 100% / 0.13);
                box-shadow:
                    1px 1px hsl(0 0% 100% / 0.35) inset,
                    -1px -1px hsl(0 0% 100% / 0.25) inset,
                    0 0 2px hsl(0 0% 0% / 0.13);
                backdrop-filter: saturate(1.1) contrast(1.12) blur(1px);
                padding: 6px 8px;
            }

            .player__menu {
                display: none;
                flex-direction: column;
                min-width: 100px;
                max-height: 100px;
                position: absolute;
                bottom: calc(var(--player-margin-block) + 2.25rem);
                right: var(--player-margin-inline);
                color: hsl(0 0% 92%);
                border: 1px solid hsl(0 0% 100% / 0.08);
                outline: 0.875px solid hsl(0 0% 6%);
                border-radius: 8px;
                background: hsl(0 0% 8% / 0.82);
                backdrop-filter: blur(5px);
                box-shadow: 0 8px 10px hsl(0 0% 0% / 0.5);
                overflow-y: auto;
                z-index: 3;

                &.visible {
                    display: flex;
                }
            }

            .player__menu-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 0.625rem;

                &:hover {
                    background: hsl(0 0% 16% / 0.75);
                }
            }

            .player__menu-item + .player__menu-item {
                position: relative;
            
                &::before {
                    content: "";
                    position: absolute;
                    top: 0;
                    left: 0.75rem;
                    right: 0.75rem;
                    height: 1px;
                    background: hsl(0 0% 100% / 0.06);
                }
            }

            .player__menu-item,
            .player__menu-label,
            .player__menu--sub > button {
                font-size: 11px;
                text-align: left;
            }

            .player__menu-item,
            .player__menu--sub > button {
                padding: 8px 18px;
            }

            .player__menu--sub > button {
                color: hsl(0 0% 72%);

                &:hover {
                    background: hsl(0 0% 16% / 0.75);
                }

                &.active {
                    color: hsl(0 0% 92%);
                }
            }

            .player__menu--back-btn {
                display: flex;
                align-items: center;
                gap: 0.25rem;
                cursor: pointer;
            }

            .player__menu-item .svg-icon,
            .player__menu--back-btn .svg-icon {
                flex-shrink: 0;
            }

            .player__watermark {
                display: block;
                position: absolute;
                bottom: 6%;
                right: 6%;
                width: clamp(24px, 5vw, 80px);
                aspect-ratio: 1;
                border-radius: clamp(7px, 1.5vw, 18px);
                opacity: 0.35;
                pointer-events: none;
                z-index: 6;
            }

            #player.overlay_visible .player__watermark {
                opacity: 0;
            }

            #subtitles {
                position: absolute;
                left: 50%;
                bottom: var(--subtitles-bottom, 5%);
                transform: translateX(-50%);
                font-size: clamp(10px, 2vw, 21px);
                font-weight: 600;
                width: fit-content;
                max-width: 75%;
                white-space: normal;
                overflow-wrap: break-word;
                text-align: center;
                color: hsl(0 0% 94%);
                background: hsl(0 0% 0% / 0.5);
                opacity: 0;
                padding: 2px 4px;
                pointer-events: none;

                &.visible {
                    opacity: 1;
                }
            }

            #player.overlay_visible #subtitles {
                --subtitles-bottom: calc(var(--player-margin-block) * 2 + 2.5rem);
            }

            @media (min-width: 540px) {
                .player__toolbar-group {
                    font-size: 1.125rem;
                    gap: 1.125rem;
                    background: transparent !important;
                    box-shadow: none !important;
                    backdrop-filter: none !important;
                    padding: 8px 0 !important;
                }
            }

            @media (min-width: 720px) {
                .main-episode__description {
                    font-size: 1rem;
                }

                .main-episode__meta {
                    font-size: 0.875rem;
                }

                .main-episode__metatag {
                    font-size: 0.875rem;
                    border-radius: 4px;
                    padding: 0 4px;
                }

                .rating__value {
                    font-size: 1.5rem;
                }

                .rating__max {
                    font-size: 0.75rem;
                }

                .info__title {
                    font-size: 0.875rem;
                }

                .info__description {
                    font-size: 0.875rem;
                    margin-bottom: 1.5rem;
                }
            }

            @media (orientation: landscape) {
                :root {
                    --player-margin-inline: 36px;
                    --player-margin-block: 16px;
                }

                .player__overlay {
                    background: transparent;
                }

                .player__overlay::before {
                    content: "";
                    position: absolute;
                    inset: 0;
                    pointer-events: none;
                    background: linear-gradient(to bottom, hsl(0 0% 0% / 0.6) 0%, transparent 40%), linear-gradient(to top, hsl(0 0% 0% / 0.6) 0%, transparent 40%);
                }

                .player__button--skip {
                    margin-inline: calc(var(--player-margin-inline) - 4px);
                }

                .player__time-wrapper {
                    gap: 0.875rem;
                }

                .player__seekbar input[type="range"]::-webkit-slider-thumb {
                    background: transparent;
                }

                .player__seekbar input[type="range"]::-moz-range-thumb {
                    background: transparent;
                }

                .player__controls--bottom {
                    gap: 0.125rem;
                }

                .player__seekbar-track,
                .player__seekbar-fill,
                .player__seekbar-buffered {
                    height: 5px;
                }

                .player__menu {
                    max-height: 140px;
                    bottom: calc(var(--player-margin-block) + 2.5rem);
                }

                .player__menu-item,
                .player__menu-label,
                .player__menu--sub > button {
                    font-size: 12px;
                }

                .player__menu-item,
                .player__menu--sub > button {
                    padding: 9px 19px;
                }
            }

            @media (min-width: 720px) and (orientation: landscape) {
                :root {
                    --player-margin-inline: 46px;
                    --player-margin-block: 28px;
                }

                .player__overlay::before {
                    content: "";
                    position: absolute;
                    inset: 0;
                    pointer-events: none;
                    background: linear-gradient(to bottom, hsl(0 0% 0% / 0.3) 0%, transparent 50%), linear-gradient(to top, hsl(0 0% 0% / 0.3) 0%, transparent 50%);
                }

                .player__button--skip {
                    margin-inline: calc(var(--player-margin-inline) - 8px);
                }

                .player__back-btn {
                    font-size: 23px;
                    top: var(--player-margin-block);
                    left: 36px;
                    padding: 10px;
                }

                .player__meta-title {
                    font-size: 17px;
                    font-weight: 600;
                }

                .player__meta-episode {
                    font-size: 15px;
                }

                .player__seekbar-track,
                .player__seekbar-fill,
                .player__seekbar-buffered {
                    height: 7px;
                }

                .player__menu {
                    max-height: 160px;
                    bottom: calc(var(--player-margin-block) + 3rem);
                }

                .player__time-wrapper {
                    gap: 22px;
                }

                .player__time {
                    font-size: 14px;
                }

                .player__toolbar-group {
                    font-size: 23px;
                    gap: 24px;
                }

                .player__controls--bottom {
                    gap: 12px;
                }

                .player__menu-item,
                .player__menu-label,
                .player__menu--sub > button {
                    font-size: 14px;
                }

                .player__menu-item,
                .player__menu--sub > button {
                    padding: 11px 20px;
                }

                #subtitles {
                    padding: 4px 6px;
                }

                #player.overlay_visible #subtitles {
                    --subtitles-bottom: calc(var(--player-margin-block) * 2 + 3.5rem);
                }
