name: Minify and deploy to build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install minifiers
        run: npm install -g html-minifier-terser lightningcss-cli terser

      - name: Copy site to dist
        run: |
          mkdir dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='node_modules' ./ dist/

      - name: Minify
        run: |
          find dist -name '*.html' -print0 | while IFS= read -r -d '' f; do
            html-minifier-terser --collapse-whitespace --remove-comments \
          --minify-css true \
          --minify-js '{"module":true}' \
          --process-scripts application/ld+json \
          -o "$f" "$f"
          done
          find dist -name '*.css' ! -name '*.min.css' -print0 | while IFS= read -r -d '' f; do
            lightningcss --minify "$f" -o "$f"
          done
          find dist -name '*.js' ! -name '*.min.js' -print0 | while IFS= read -r -d '' f; do
            terser "$f" --module --compress --mangle -o "$f"
          done

      - name: Deploy to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: build
          publish_dir: ./dist
